name: AYRA v2.1 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AYRA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract AYRA ZIP
        shell: bash
        run: |
          set -e

          mkdir -p _ayra_build

          ZIP_FILE=$(find . -type f \
            -name 'AYRA_v2.1_GitHub_Ready_APK_Ready_FINAL.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AYRA ZIP not found."
            echo "Available ZIP files:"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d _ayra_build

          PROJECT_DIR=$(find _ayra_build \
            -type f \
            -name 'settings.gradle.kts' \
            -printf '%h\n' \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "AYRA project:"
          echo "$PROJECT_DIR"

      - name: Verify project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure verified."

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Find generated APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AYRA-v2.1-APKs
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
